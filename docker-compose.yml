version: '3.8'

services:
  # ==========================================================
  # PostgreSQL Time-Series & Window Database
  # ==========================================================
  db:
    image: postgres:16-alpine
    container_name: crashguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-system_monitoring}
      POSTGRES_USER: ${DB_USER:-siddhijain}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Siddhi12}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-siddhijain} -d ${DB_NAME:-system_monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crashguard-net

  # ==========================================================
  # CrashGuard AI - Telemetry Ingestion & Dashboard API
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crashguard-app
    restart: unless-stopped
    pid: "host"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-system_monitoring}
      DB_USER: ${DB_USER:-siddhijain}
      DB_PASSWORD: ${DB_PASSWORD:-Siddhi12}
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./dataset.csv:/app/dataset.csv
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crashguard-net

volumes:
  postgres_data:
    driver: local

networks:
  crashguard-net:
    driver: bridge
